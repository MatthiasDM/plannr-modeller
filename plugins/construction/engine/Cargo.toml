[package]
name = "plannr-plugin-construction"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plannr construction plugin: storeys, rooms, walls, openings, roofs, fixtures and runs, built as Belgian masonry (cavity walls, potten en balken / welfsels floors) with takeoff, checks and U-values"

[lib]
path = "src/lib.rs"

[dependencies]
plannr-core = { path = "../../../crates/plannr-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
boa_engine = { version = "0.22", default-features = false }

[dev-dependencies]
plannr-plugin-framing = { path = "../../framing/engine" }
