[package]
name = "plannr-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plannr server: REST API, WebSocket viewport channel, MCP endpoint, SQLite persistence, static frontend"

[[bin]]
name = "plannr-server"
path = "src/main.rs"

[dependencies]
plannr-core = { path = "../plannr-core" }
axum = { version = "0.8", features = ["json", "query", "macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
# installed plugins: WebAssembly engines in a sandbox, packages are zip files
wasmtime = { version = "48", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "48", default-features = false, features = ["p1"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
